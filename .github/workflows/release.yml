name: Build and publish release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Restore dependencies
        run: dotnet restore TimeGuard.slnx

      - name: Build installers
        shell: pwsh
        run: .\installer\build-installers.ps1 -Compiler "${{ github.workspace }}\installer\tools\Inno\ISCC.exe"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $assets = @(
            "installer/dist/TimeGuard-Parent-Setup.exe",
            "installer/dist/TimeGuard-Client-Setup.exe",
            "installer/dist/TimeGuard-Parent-Setup.zip",
            "installer/dist/TimeGuard-Client-Setup.zip"
          )
          gh release create $tag @assets --title "TimeGuard $tag" --generate-notes
          if ($LASTEXITCODE -ne 0) {
            gh release upload $tag @assets --clobber
          }
